<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <form class="registration-form" action="#" method="post" enctype="multipart/form-data">
        <h1>
            Registration Form for Students</h1>

        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>

        <label for="fatherName">Father's Name</label>
        <input type="text" id="fatherName" name="fatherName" placeholder="Enter your father's name" required>

        <label for="regNo">Registration Number</label>
        <input type="text" id="regNo" name="regNo" placeholder="e.g. 251234" required>

        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" placeholder="example@student.au.edu.pk" required>

        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" minlength="6" required>

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Re-enter password" minlength="6" required>

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required>

        <label>Gender</label>
        <div class="radio-group">
            <label class="inline-label"><input type="radio" name="gender" value="male" required> Male</label>
            <label class="inline-label"><input type="radio" name="gender" value="female"> Female</label>
            <label class="inline-label"><input type="radio" name="gender" value="other"> Other</label>
        </div>

        <label for="department">Department</label>
        <select id="department" name="department" required>
            <option value="">-- Select Department --</option>
            <option value="BSSE">BSSE</option>
            <option value="BSAI">BSAI</option>
            <option value="BSDS">BSDS</option>
            <option value="BSCS">BSCS</option>
        </select>

        <label for="semester">Semester</label>
        <select id="semester" name="semester" required>
            <option value="">-- Select Semester --</option>
            <option value="1">1st</option>
            <option value="2">2nd</option>
            <option value="3">3rd</option>
            <option value="4">4th</option>
            <option value="5">5th</option>
            <option value="6">6th</option>
            <option value="7">7th</option>
            <option value="8">8th</option>
        </select>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" placeholder="03XX-XXXXXXX" pattern="[0-9\-+ ]{10,15}" required>

        <label for="address">Permanent Address</label>
        <textarea id="address" name="address" rows="3" placeholder="Enter your permanent address" required></textarea>

        <label for="profilePic">Profile Picture</label>
        <input type="file" id="profilePic" name="profilePic" accept="image/*">

        <label class="inline-label terms">
            <input type="checkbox" name="terms" required> I agree to the Terms and Conditions
        </label>

        <div class="button-group">
            <button type="submit" class="btn btn-register">Register</button>
            <button type="reset" class="btn btn-reset">Reset</button>
        </div>
    </form>

</body>
</html>
